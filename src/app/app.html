<div class="container">
  <h1>Minha Lista de Tarefas</h1>

  <form class="nova-tarefa" (ngSubmit)="adicionarTarefa()">
    <input
      type="text"
      [(ngModel)]="novaTarefa"
      name="novaTarefa"
      placeholder="Digite uma nova tarefa..."
      autocomplete="off"
    />
    <button type="submit">Adicionar</button>
  </form>

  <div class="filtros">
    <button type="button" [class.ativo]="filtro === 'todas'" (click)="filtro = 'todas'">Todas</button>
    <button type="button" [class.ativo]="filtro === 'pendentes'" (click)="filtro = 'pendentes'">Pendentes</button>
    <button type="button" [class.ativo]="filtro === 'concluidas'" (click)="filtro = 'concluidas'">Concluídas</button>
  </div>

  <ul class="lista">
    <li *ngFor="let tarefa of tarefasFiltradas" [class.concluida]="tarefa.concluida">
      <label>
        <input type="checkbox" [checked]="tarefa.concluida" (change)="alternarConclusao(tarefa)" />
        <span>{{ tarefa.texto }}</span>
      </label>
      <button type="button" class="remover" (click)="removerTarefa(tarefa)">✕</button>
    </li>
  </ul>

  <p class="resumo" *ngIf="tarefas.length > 0">
    {{ totalPendentes }} tarefa(s) pendente(s) de {{ tarefas.length }} no total
  </p>

  <p class="vazio" *ngIf="tarefas.length === 0">Nenhuma tarefa ainda. Adicione uma acima!</p>
</div>
